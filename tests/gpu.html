<!doctype html><meta charset="utf-8"><title>EIGACAM GPU verification</title><style>body{background:#18201a;color:#ddede1;font:14px/1.8 monospace;padding:30px}canvas{width:350px}pre{white-space:pre-wrap}</style><h1>EIGACAM · Image pipeline checks</h1><canvas id="gpu"></canvas><pre id="result">Running…</pre><script type="module">
import {Renderer} from '../dist/src/engine/renderer.js';import {createState,PRESETS,findLayer} from '../dist/src/presets.js';import {makeLayer,clone} from '../dist/src/model.js';import {identity} from '../dist/src/curves.js';
const out=document.querySelector('#result'),rows=[];let failed=0;
function check(name,ok,value=''){rows.push(`${ok?'PASS':'FAIL'} ${name} ${value}`);if(!ok)failed++;out.textContent=rows.join('\n');}
try{
const c=document.createElement('canvas');c.width=320;c.height=200;const x=c.getContext('2d');const gradient=x.createLinearGradient(0,0,320,0);gradient.addColorStop(0,'#050a12');gradient.addColorStop(.4,'#527355');gradient.addColorStop(.7,'#c88458');gradient.addColorStop(1,'#ffefbb');x.fillStyle=gradient;x.fillRect(0,0,320,200);x.fillStyle='white';x.fillRect(230,40,25,25);x.fillStyle='#293e42';x.fillRect(30,40,30,30);
const r=new Renderer(document.querySelector('#gpu'));r.setSource(c,320,200);const g=r.gl;
const pixels=()=>{const p=new Uint8Array(320*200*4);g.readPixels(0,0,320,200,g.RGBA,g.UNSIGNED_BYTE,p);return p;};
const difference=(a,b)=>{let max=0,sum=0;for(let i=0;i<a.length;i++){if(i%4===3)continue;const d=Math.abs(a[i]-b[i]);max=Math.max(max,d);sum+=d;}return {max,mean:sum/(a.length/4*3)};};
const neutral={exposure:0,mix:1,layers:[]};r.render(neutral);const base=pixels();
for(const p of PRESETS){const s=createState(p.id);s.mix=0;r.render(s);const zero=difference(base,pixels());check(`${p.id}: MIX 0 preserves source`,zero.max<=1,JSON.stringify(zero));s.mix=1;r.render(s);const diff=difference(base,pixels());check(`${p.id}: preset changes pixels`,diff.mean>1,JSON.stringify(diff));check(`${p.id}: GPU valid`,g.getError()===g.NO_ERROR);}
const mono=createState('kurosawa');r.render(mono);const monoPixels=pixels();let chroma=0;for(let i=0;i<monoPixels.length;i+=4)chroma=Math.max(chroma,Math.abs(monoPixels[i]-monoPixels[i+1]),Math.abs(monoPixels[i+1]-monoPixels[i+2]));check('kurosawa default is truly monochrome',chroma<=1,`max channel difference ${chroma}`);
for(const p of PRESETS.slice(6)){const state=createState(p.id);r.render(state);const before=pixels();await r.export(state,()=>{});check(`${p.id}: preview/export agree`,difference(before,pixels()).max===0);const loaded=JSON.parse(JSON.stringify(state));r.render(loaded);check(`${p.id}: saved state renders identically`,difference(before,pixels()).max===0);}
r.render({...neutral,layers:[makeLayer('curves',identity())]});check('identity curve unchanged',difference(base,pixels()).max<=1,JSON.stringify(difference(base,pixels())));
const curve=makeLayer('curves',identity());curve.params.m2=67;r.render({...neutral,layers:[curve]});check('master curve affects output',difference(base,pixels()).mean>3);
const red=makeLayer('curves',identity());red.params.r2=67;r.render({...neutral,layers:[red]});const redPixels=pixels();let delta=[0,0,0];for(let i=0;i<base.length;i++)if(i%4<3)delta[i%4]+=Math.abs(redPixels[i]-base[i]);check('red curve changes red independently',delta[0]>10000&&delta[1]<100&&delta[2]<100,JSON.stringify(delta));
const s=createState();r.render(s);const preview=pixels();await r.export(s,()=>{});check('preview/export same size match',difference(preview,pixels()).max===0);
const noLight=clone(s);findLayer(noLight,'bloom').enabled=false;r.render(noLight);check('highlight switch affects output',difference(preview,pixels()).mean>.1);
const noShadow=clone(s);findLayer(noShadow,'shadow').enabled=false;r.render(noShadow);check('shadow switch affects output',difference(preview,pixels()).mean>.1);
const bright=clone(s);bright.mix=0;bright.exposure=1;r.render(bright);check('exposure remains independent at MIX 0',difference(base,pixels()).mean>5);
r.render(s);const blob=await new Promise(resolve=>r.canvas.toBlob(resolve,'image/jpeg',.95));check('JPEG encoding',blob?.size>1000,blob?.size);
check('GPU no final error',g.getError()===g.NO_ERROR);
rows.push(`\n${failed===0?'ALL CHECKS PASSED':failed+' FAILED'}`);out.textContent=rows.join('\n');document.title=failed===0?'PASS — EIGACAM GPU':'FAIL — EIGACAM GPU';
}catch(e){out.textContent+='\nERROR '+e.stack;document.title='FAIL — EIGACAM GPU';}
</script>
