<!doctype html><meta charset="utf-8"><title>EIGACAM responsive checks</title><style>body{background:#292929;color:white;font:14px monospace;padding:16px}main{display:flex;gap:20px;align-items:start;flex-wrap:wrap}iframe{border:0;display:block}section{flex:none}pre{white-space:pre-wrap}</style><h1>Phone layouts</h1><pre id="results">Running…</pre><main></main><script type="module">
const html=(await(await fetch('../dist/index.html')).text()).replace('<head>','<head><base href="'+location.origin+'/dist/">');const photo=await(await fetch('../dist/assets/portrait.jpg')).blob();const out=document.querySelector('#results');out.textContent='';let failed=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));async function until(fn){for(let i=0;i<160;i++){if(fn())return;await wait(40);}throw Error('Timed out');}
for(const [width,height,panel] of [[320,568,'mix'],[375,667,'curves'],[844,390,'']]){
 const section=document.createElement('section');section.textContent=width+' × '+height;const frame=document.createElement('iframe');frame.style.width=width+'px';frame.style.height=height+'px';section.append(frame);document.querySelector('main').append(section);frame.srcdoc=html;await until(()=>frame.contentDocument.querySelector('#presets')?.children.length===5);
 const doc=frame.contentDocument,win=frame.contentWindow;const data=new win.DataTransfer();data.items.add(new win.File([photo],'portrait.jpg',{type:'image/jpeg'}));doc.querySelector('#photoInput').files=data.files;doc.querySelector('#photoInput').dispatchEvent(new win.Event('change'));await until(()=>!doc.querySelector('#exportTop').disabled);if(panel)doc.querySelector('[data-panel="'+panel+'"]').click();await wait(100);
 const ok=doc.documentElement.scrollWidth===width&&doc.documentElement.scrollHeight===height;out.textContent+=(ok?'PASS ':'FAIL ')+width+'×'+height+' no page scrolling\n';if(!ok)failed++;
 for(const id of ['camera','upload','exportTop',...(panel?['tray']:[])]){const r=doc.getElementById(id).getBoundingClientRect(),visible=r.left>=0&&r.top>=0&&r.right<=width&&r.bottom<=height;out.textContent+=(visible?'PASS ':'FAIL ')+width+'×'+height+' '+id+' within viewport\n';if(!visible)failed++;if(id!=='tray'){const hit=doc.elementFromPoint((r.left+r.right)/2,(r.top+r.bottom)/2),reachable=hit?.closest('button')===doc.getElementById(id);out.textContent+=(reachable?'PASS ':'FAIL ')+width+'×'+height+' '+id+' not covered\n';if(!reachable)failed++;}}
}
document.title=(failed?'FAIL':'PASS')+' — Responsive layouts';out.textContent+='\n'+(failed?'FAILED':'ALL CHECKS PASSED');
</script>
