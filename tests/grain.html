<!doctype html><meta charset="utf-8"><title>EIGACAM Grain QA</title><style>body{background:#151917;color:#ddd;font:14px/1.7 sans-serif;padding:24px}h1{font-size:25px}.samples{display:flex;gap:16px}figure{margin:0;flex:1}canvas{width:100%;display:block}pre{white-space:pre-wrap}</style><h1>同一張照片 · 顆粒 0 / 40 / 80%</h1><p>固定大小 3.5、粗糙度 55%，以下影像由正式調色引擎產生。</p><div class="samples" id="samples"></div><pre id="result">Running…</pre><script type="module">
import {Renderer} from '../dist/src/engine/renderer.js';import {makeLayer} from '../dist/src/model.js';import {createState,findLayer} from '../dist/src/presets.js';
let failures=0;const rows=[],out=document.querySelector('#result');function check(label,ok,value=''){rows.push(`${ok?'PASS':'FAIL'} ${label} ${value}`);if(!ok)failures++;out.textContent=rows.join('\n');}
const rms=(a,b)=>{let sum=0;for(let i=0;i<a.length;i+=4)sum+=(a[i]-b[i])**2;return Math.sqrt(sum/(a.length/4));};
function read(r){const a=new Uint8Array(r.width*r.height*4);r.gl.readPixels(0,0,r.width,r.height,r.gl.RGBA,r.gl.UNSIGNED_BYTE,a);return a;}
function flat(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#808080';x.fillRect(0,0,w,h);return c;}
function sampleCanvas(c,w,h){const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(c,0,0,w,h);return x.getImageData(0,0,w,h).data;}
try{
const canvas=document.createElement('canvas'),r=new Renderer(canvas);r.setSource(flat(1280,800),1280,800);const grain=makeLayer('grain',{amount:0,size:3.5,roughness:.55}),state={exposure:0,mix:1,layers:[grain]};r.render(state);const base=read(r);let previous=0;
for(const percent of [0,25,50,100]){grain.params.amount=percent/100*.35;r.render(state);const a=read(r),noise=rms(a,base);check(`strength ${percent}%`,percent===0?noise===0:noise>previous+2,noise.toFixed(2)+' DN RMS');previous=noise;if(percent===100){let chroma=0;for(let i=0;i<a.length;i+=4)chroma=Math.max(chroma,Math.abs(a[i]-a[i+1]),Math.abs(a[i]-a[i+2]));check('neutral silver grain, no coloured noise',chroma===0);}}
grain.params.amount=.175;r.render(state);const a=read(r);r.render(state);check('stationary pattern on repeated renders',rms(a,read(r))===0);await r.export(state,()=>{});check('same-size export matches preview',rms(a,read(r))===0);
const smallFit=sampleCanvas(canvas,320,200);grain.params.size=7;r.render(state);check('size visibly changes texture',rms(a,read(r))>5);grain.params.size=3.5;grain.params.roughness=0;r.render(state);const smooth=read(r);grain.params.roughness=1;r.render(state);check('roughness changes clumping',rms(smooth,read(r))>3);grain.params.roughness=.55;
state.mix=0;r.render(state);check('MIX 0 still preserves source',rms(base,read(r))===0);state.mix=1;
r.setSource(flat(2560,1600),2560,1600);r.render(state);const largeFit=sampleCanvas(canvas,320,200);check('export texture survives fit-to-screen',rms(largeFit,new Uint8Array(largeFit.length).fill(128))>5);check('preview/export normalized grain agree',rms(smallFit,largeFit)<3,rms(smallFit,largeFit).toFixed(2)+' DN RMS; preview='+rms(smallFit,new Uint8Array(smallFit.length).fill(128)).toFixed(2)+' export='+rms(largeFit,new Uint8Array(largeFit.length).fill(128)).toFixed(2));
const jpeg=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.95));const decoded=await createImageBitmap(jpeg);const jpegFit=sampleCanvas(decoded,320,200);check('JPEG retains grain texture',rms(jpegFit,new Uint8Array(jpegFit.length).fill(128))>5);decoded.close();r.destroy();
const img=new Image();img.src='../dist/assets/portrait.jpg';await img.decode();
for(const percent of [0,40,80]){const fig=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');caption.textContent=`顆粒 ${percent}%`;fig.append(c,caption);document.querySelector('#samples').append(fig);const render=new Renderer(c);render.setSource(img,600,Math.round(img.height/img.width*600));const s=createState('coast');s.mix=1;const g=findLayer(s,'grain');g.params.amount=percent/100*.35;g.params.size=3.5;g.params.roughness=.55;render.render(s);}
rows.push(failures?'FAILED '+failures:'ALL CHECKS PASSED');out.textContent=rows.join('\n');document.title=failures?'FAIL — Grain QA':'PASS — Grain QA';
}catch(e){out.textContent+='\n'+e.stack;document.title='FAIL — Grain QA';}
</script>
