<!doctype html><meta charset="utf-8"><title>EIGACAM detail quality</title><style>body{background:#171b19;color:#eee;font:14px monospace}canvas{max-width:420px}pre{white-space:pre-wrap}</style><h1>Diffusion and detail preservation</h1><canvas id="view"></canvas><pre id="results">Running…</pre><script type="module">
import {Renderer} from '../dist/src/engine/renderer.js';import {createState,findLayer} from '../dist/src/presets.js';
const before=await(await fetch('./quality-before.json')).json();let failed=0;const out=document.querySelector('#results');out.textContent='';function check(ok,label,data){out.textContent+=(ok?'PASS ':'FAIL ')+label+' '+JSON.stringify(data)+'\n';if(!ok)failed++;}
const source=document.createElement('canvas');source.width=512;source.height=384;const x=source.getContext('2d');x.fillStyle='#303030';x.fillRect(0,0,512,384);x.fillStyle='#808080';x.fillRect(0,192,512,192);for(let i=0;i<64;i++){x.fillStyle=i%2?'#656565':'#999999';x.fillRect(i*4,240,4,80);}x.fillStyle='#fff';x.fillRect(420,40,20,20);
const r=new Renderer(document.querySelector('#view'));r.setSource(source,512,384);const pixels=()=>{const a=new Uint8Array(512*384*4);r.gl.readPixels(0,0,512,384,r.gl.RGBA,r.gl.UNSIGNED_BYTE,a);return a;};const val=(a,x,y)=>{const i=((383-y)*512+x)*4;return (a[i]+a[i+1]+a[i+2])/3;};const contrast=a=>{let sum=0;for(let y=250;y<310;y++)for(let i=2;i<62;i+=2)sum+=Math.abs(val(a,i*4+1,y)-val(a,(i+1)*4+1,y));return sum/(60*30);};const avg=a=>{let sum=0;for(let y=20;y<150;y++)for(let x=20;x<150;x++)sum+=val(a,x,y);return sum/16900;};
for(const s of [before.iwai,createState('iwai')])findLayer(s,'grain').enabled=false;
r.render(before.iwai);const old=pixels();const current=createState('iwai');findLayer(current,'grain').enabled=false;r.render(current);const clean=pixels();check(contrast(clean)>contrast(old)*1.08,'fine structure gains contrast without sharpening',{before:contrast(old),after:contrast(clean)});check(avg(clean)<avg(old)-3,'dark patch keeps density instead of grey veil',{before:avg(old),after:avg(clean)});
const noBloom=structuredClone(current);findLayer(noBloom,'bloom').enabled=false;r.render(noBloom);const unlit=pixels();let halo=0;for(let y=35;y<65;y++)for(let x=414;x<446;x++){if(x>=420&&x<440&&y>=40&&y<60)continue;halo=Math.max(halo,val(clean,x,y)-val(unlit,x,y));}check(halo>1,'highlight halo still visible',halo);
for(const id of ['iwai','nocturne']){const a=before[id],b=createState(id);findLayer(a,'grain').enabled=true;const noise=s=>{r.render(s);const withGrain=pixels();const copy=structuredClone(s);findLayer(copy,'grain').enabled=false;r.render(copy);const clean=pixels();let sum=0;for(let y=100;y<180;y++)for(let x=100;x<180;x++)sum+=(val(withGrain,x,y)-val(clean,x,y))**2;return Math.sqrt(sum/6400);};const n0=noise(a),n1=noise(b);check(n1<n0&&n1>0,'finer default grain remains present: '+id,{before:n0,after:n1});}
r.render(current);check(r.gl.getError()===r.gl.NO_ERROR,'GPU valid');out.textContent+='\n'+(failed?'FAILED':'ALL CHECKS PASSED');document.title=(failed?'FAIL':'PASS')+' — Detail quality';
</script>
