<!doctype html><meta charset="utf-8"><title>EIGACAM photo delivery integration</title><style>body{background:#111;color:#eee;font:14px monospace}iframe{width:390px;height:844px;border:0}pre{white-space:pre-wrap}</style><h1>Photo delivery integration — mocked OS share</h1><pre id="results">Running…</pre><iframe id="app"></iframe><script type="module">
const out=document.querySelector('#results'),frame=document.querySelector('#app');let failures=0;out.textContent='';const wait=ms=>new Promise(r=>setTimeout(r,ms));async function until(fn){for(let i=0;i<200;i++){if(fn())return;await wait(30);}throw Error('Timed out');}
function check(ok,label){out.textContent+=(ok?'PASS ':'FAIL ')+label+'\n';if(!ok)failures++;}
const fake=`<script>window.shareCalls=[];window.downloads=0;window.shareMode='success';Object.defineProperty(navigator,'canShare',{configurable:true,value:()=>window.shareMode!=='unsupported'});Object.defineProperty(navigator,'share',{configurable:true,value:data=>{window.shareCalls.push(data);if(window.shareMode==='cancel')return Promise.reject({name:'AbortError'});if(window.shareMode==='failure')return Promise.reject({name:'NotAllowedError'});return Promise.resolve();}});document.addEventListener('click',e=>{if(e.target.closest('a[download]')){window.downloads++;e.preventDefault();}},true);<\/script>`;
try{
 const html=await(await fetch('../dist/index.html')).text();frame.srcdoc=html.replace('<head>','<head><base href="'+location.origin+'/dist/">'+fake);await until(()=>frame.contentDocument?.querySelector('#presets')?.children.length===5);
 const doc=frame.contentDocument,win=frame.contentWindow,$=s=>doc.querySelector(s),blob=await(await fetch('../dist/assets/portrait.jpg')).blob(),transfer=new win.DataTransfer();transfer.items.add(new win.File([blob],'portrait.jpg',{type:'image/jpeg'}));$('#photoInput').files=transfer.files;$('#photoInput').dispatchEvent(new win.Event('change'));await until(()=>!$('#exportTop').disabled);
 $('#exportSize').value='2560';$('#exportTop').click();await until(()=>!$('#savePhoto').disabled);check($('#savePhoto').textContent==='儲存／分享照片','primary action uses system photo sharing');check(win.shareCalls.length===0&&win.downloads===0,'preparing photo neither shares nor downloads automatically');
 $('#savePhoto').click();await until(()=>!$('#savePhoto').disabled);const first=win.shareCalls[0];check(Object.keys(first).join()==='files'&&first.files[0].type==='image/jpeg','shares a JPEG File, not a webpage');const bitmap=await createImageBitmap(first.files[0]);check(bitmap.width===1707&&bitmap.height===2560,'shared JPEG uses selected output dimensions');bitmap.close();check(!$('#exportStatus').textContent.includes('已儲存'),'success does not falsely claim album save');
 win.shareMode='cancel';$('#savePhoto').click();await until(()=>!$('#savePhoto').disabled);check($('#exportStatus').textContent.includes('取消')&&win.downloads===0,'cancel keeps photo without downloading');
 win.shareMode='failure';$('#savePhoto').click();await until(()=>!$('#savePhoto').disabled);check(!$('#saveFallback').hidden&&$('#savePreview').src.startsWith('blob:')&&win.downloads===0,'share failure offers long-press photo without downloading');
 win.shareMode='unsupported';$('#exportSize').value='1280';$('#exportSize').dispatchEvent(new win.Event('change'));await until(()=>!$('#savePhoto').disabled);check(!$('#saveFallback').hidden&&$('#savePhoto').textContent.includes('顯示照片'),'unsupported browser shows image-saving fallback');check($('#outputInfo').textContent.includes('1,280'),'size change regenerates output');
 win.shareMode='success';$('#savePhoto').click();await until(()=>!$('#savePhoto').disabled);const second=win.shareCalls.at(-1).files[0],smaller=await createImageBitmap(second);check(smaller.width===853&&smaller.height===1280&&second!==first.files[0],'sharing uses regenerated JPEG rather than stale file');smaller.close();
 $('#download').click();check(win.downloads===1,'download occurs only after explicit secondary button');
 $('#exportDialog').close();$('#lookPicker').click();$('[data-look="kurosawa"]').click();$('#closeTray').click();$('#exportTop').click();await until(()=>!$('#savePhoto').disabled);$('#savePhoto').click();await until(()=>!$('#savePhoto').disabled);check(win.shareCalls.at(-1).files[0].name.includes('黑白銀鹽'),'reopening after edit prepares current look');
 out.textContent+='\n'+(failures?'FAILED':'ALL CHECKS PASSED');document.title=(failures?'FAIL':'PASS')+' — Photo delivery';
}catch(e){out.textContent+='ERROR '+e.stack;document.title='FAIL — Photo delivery';}
</script>
