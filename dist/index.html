<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="電影調色相機：即時取景、電影色彩、寬銀幕畫幅，拍下就沖印。"><title>EIGACAM — 一拍入戲</title><link rel="icon" href="./icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/icon-192.png"><link rel="stylesheet" href="./src/style.css"></head>
<body>
<main id="app" class="app">
 <header class="hud" aria-label="相機狀態">
  <div class="hud-cell"><span id="recDot" class="rec-dot"></span><span id="hudState">STBY</span></div>
  <button id="hudLook" class="hud-cell hud-look" aria-label="目前色彩">01 CINEMA PRINT</button>
  <div class="hud-cell hud-right"><span id="hudRes" class="dim">— × —</span><button id="hqToggle" class="hq" aria-pressed="false" title="HQ：用系統相機拍攝，畫質最高">HQ</button></div>
 </header>

 <section id="viewfinder" class="viewfinder" aria-label="取景器">
  <div id="frame" class="frame">
   <canvas id="preview" aria-label="即時調色取景"></canvas>
   <div id="matte" class="matte"><div id="window" class="window"><i></i><i></i><i></i><i></i><span id="frameLabel" class="frame-label"></span></div></div>
   <div id="handles" class="handles"></div>
   <div id="lookFlash" class="look-flash" aria-hidden="true"></div>
   <div id="shutterFlash" class="shutter-flash"></div>
  </div>
  <div id="vfIdle" class="vf-idle">
   <svg viewBox="0 0 64 64" class="mark" aria-hidden="true"><rect x="6" y="16" width="38" height="32" rx="4"/><path d="M44 28l14-8v24l-14-8z"/><circle cx="18" cy="11" r="5"/><circle cx="32" cy="11" r="5"/></svg>
   <h1>讓眼前，一拍入戲。</h1>
   <p id="idleText">選一種電影色彩，直接拍。</p>
   <button id="startCamera" class="primary">開啟相機</button>
   <div class="idle-alt"><button id="idleHQ" class="ghost">HQ 系統相機</button><button id="idleImport" class="ghost">匯入照片</button></div>
  </div>
  <div id="zoom" class="zoom" hidden></div>
  <div id="busy" class="busy" hidden><span></span>沖印中</div>
 </section>

 <section class="deck" aria-label="相機控制">
  <div id="params" class="params" role="toolbar" aria-label="拍攝參數"></div>
  <div class="context">
   <div id="reel" class="reel" role="listbox" aria-label="電影色彩"></div>
   <div id="dial" class="dial" hidden>
    <div class="dial-head"><span class="dial-label"></span><output></output><button class="dial-reset">重設</button></div>
    <div class="ruler" role="slider" tabindex="0"><div class="ruler-track"></div><span class="needle"></span></div>
   </div>
   <div id="aspects" class="aspects" hidden role="radiogroup" aria-label="畫幅"></div>
  </div>
  <div id="studio" class="studio" hidden aria-label="遮色片工作室">
   <div class="studio-head"><b id="studioTitle">遮色片</b><button id="studioDelete" class="link danger-text" hidden>刪除配方</button><button id="studioSave" class="link">儲存配方</button><button id="studioDone" class="pill">完成</button></div>
   <div id="maskList" class="mask-list" role="listbox" aria-label="遮色片"></div>
   <div id="maskActions" class="mask-actions">
    <button data-act="show" aria-pressed="false">顯示範圍</button><button data-act="invert" aria-pressed="false">反轉</button><button data-act="dup">複製</button><button data-act="dupinv">複製並反轉</button><button data-act="toggle" aria-pressed="true">啟用</button><button data-act="delete" class="danger-text">刪除</button>
   </div>
   <div id="maskParams" class="params mask-params" role="toolbar" aria-label="遮色片調整"></div>
   <div id="maskDial" class="dial">
    <div class="dial-head"><span class="dial-label"></span><output></output><button class="dial-reset">重設</button></div>
    <div class="ruler" role="slider" tabindex="0"><div class="ruler-track"></div><span class="needle"></span></div>
   </div>
   <p id="studioHint" class="studio-hint">新增一個遮色片開始：漸層、圓形、明暗或顏色。</p>
  </div>
  <div class="shutter-row">
   <button id="rollButton" class="roll-button" aria-label="打開底片盒"><img id="rollThumb" alt=""><span id="rollCount" class="roll-count" hidden>0</span></button>
   <button id="shutter" class="shutter" aria-label="拍攝"><span></span></button>
   <button id="flip" class="round" aria-label="切換前後鏡頭" disabled><img src="./assets/icons/camera-rotate.svg" alt=""></button>
  </div>
 </section>
</main>

<section id="roll" class="sheet" hidden aria-label="底片盒">
 <header class="sheet-head"><button class="back" data-close-sheet aria-label="回到相機">‹ 相機</button><h2>底片盒 <small id="rollTitleCount"></small></h2><button id="rollSelect" class="link">選取</button></header>
 <div id="rollGrid" class="roll-grid"></div>
 <p id="rollEmpty" class="roll-empty">還沒有照片。拍下的每一張都會先沖印到這裡，再由你存進相簿。</p>
 <footer class="sheet-foot"><button id="rollImport" class="ghost">匯入照片沖印</button><button id="rollShare" class="primary" hidden>儲存 0 張</button><button id="rollDelete" class="danger" hidden>刪除</button></footer>
 <p class="sheet-note">照片只保存在這台裝置的瀏覽器裡，請記得儲存到相簿。</p>
</section>

<section id="viewer" class="sheet viewer" hidden aria-label="照片">
 <header class="sheet-head"><button class="back" id="viewerBack" aria-label="回到底片盒">‹ 底片盒</button><h2 id="viewerTitle"></h2><button id="viewerDelete" class="link danger-text">刪除</button></header>
 <div class="viewer-stage"><img id="viewerImage" alt=""><div id="viewerBusy" class="busy" hidden><span></span>重新沖印中</div></div>
 <p id="viewerMeta" class="viewer-meta"></p>
 <div id="viewerReel" class="reel compact" aria-label="換一種色彩重新沖印"></div>
 <footer class="sheet-foot"><button id="viewerDownload" class="ghost">下載檔案</button><button id="viewerShare" class="primary">儲存到相簿</button></footer>
 <p id="viewerStatus" class="sheet-note" role="status"></p>
</section>

<video id="cameraVideo" autoplay muted playsinline aria-hidden="true"></video>
<div id="toast" role="status" aria-live="polite"></div>
<input id="photoInput" type="file" accept="image/*" multiple hidden>
<input id="captureInput" type="file" accept="image/*" capture="environment" hidden>
<input id="cubeInput" type="file" accept=".cube" hidden>
<script type="module" src="./src/app.js"></script>
</body></html>
